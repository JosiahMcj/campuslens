# deploy/nginx.conf — Golden Eagle AI Cabinet, HTTPS front for nginx.
# Equivalent to deploy/Caddyfile for hosts that already run nginx. This is a
# complete standalone configuration; on a Debian-style layout you may instead
# copy the two `server` blocks into /etc/nginx/sites-available/cabinet and
# keep the zones in the http context.
#
# TLS: let certbot own the certificate. Install the config, then:
#   certbot --nginx -d cabinet.example.edu
# Certbot rewrites the ssl_certificate* paths to its own and maintains the
# renewal. The paths below are certbot's defaults for the domain.
#
# Validate: nginx -t -c /opt/golden-eagle-cabinet/deploy/nginx.conf

events {
	worker_connections 1024;
}

http {
	# Edge rate limits matching the app's in-process ones (60/min general,
	# 5/min on POST /ask). The app keeps its own per-IP and per-session
	# buckets and sees the real client IP via X-Forwarded-For (the app is
	# started with CABINET_TRUSTED_PROXY pointing at this proxy).
	limit_req_zone $binary_remote_addr zone=cabinet_general:10m rate=60r/m;
	limit_req_zone $binary_remote_addr zone=cabinet_ask:10m rate=5r/m;

	upstream cabinet {
		server 127.0.0.1:8910;
	}

	server {
		listen 80;
		server_name cabinet.example.edu;  # <- CABINET_DOMAIN
		# certbot --nginx manages the ACME challenge path on this block.
		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name cabinet.example.edu;  # <- CABINET_DOMAIN

		ssl_certificate     /etc/letsencrypt/live/cabinet.example.edu/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/cabinet.example.edu/privkey.pem;

		# HSTS at the edge; the app sets it too (production mode).
		add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

		# One MB above the app's 20 MB dataset-upload cap (see Caddyfile).
		client_max_body_size 21m;

		location = /api/ask {
			limit_req zone=cabinet_ask burst=5 nodelay;
			proxy_pass http://cabinet;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location / {
			limit_req zone=cabinet_general burst=20 nodelay;
			proxy_pass http://cabinet;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
