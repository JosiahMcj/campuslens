name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: make setup-python PYTHON=python3
      - name: Lint
        run: make lint-python
      - name: Type check
        run: make typecheck-python
      - name: Test
        run: make test-python
      - name: Full-scale school matches VERIFY.md
        env:
          CABINET_SCHOOL_FULL: '1'
        run: .venv/bin/python -m pytest backend/tests/test_school_data.py -q -k full_scale

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: make setup-ui
      - name: Lint
        run: make lint-ui
      - name: Type check
        run: make typecheck-ui
      - name: Test
        run: make test-ui
